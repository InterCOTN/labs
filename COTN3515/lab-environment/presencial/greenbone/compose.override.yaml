# Se combina con el compose oficial de Greenbone Community Edition (descargado por setup.py).
# Conecta el escáner a la red del objetivo del curso (10.79.0.0/24) para poder escanear 10.79.0.20.
# Requisito: el objetivo debe estar encendido primero:
#   docker compose -f ../../compose.scan.yaml up -d --wait
networks:
  scan:
    external: true
    name: redfaro-scan_scan
# Hora local de Puerto Rico (UTC-4, sin horario de verano) en los logs de los contenedores.
# Greenbone guarda todo en UTC; en la interfaz web cada usuario ajusta su zona en Settings -> User Settings -> Timezone.
x-tz: &tz
  TZ: America/Puerto_Rico
services:
  ospd-openvas:
    environment: *tz
    networks:
      - default
      - scan
  gvmd:
    environment: *tz
  gsad:
    environment: *tz
  pg-gvm:
    environment: *tz
  openvasd:
    environment: *tz
